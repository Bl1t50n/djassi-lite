name: Release

# Lançar: dev → qa/testing/staging → main, depois tag vX.Y.Z no main.
# O djassi update compara com o package.json do main, por isso a tag tem de estar no main.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com a versão $version do package.json"
            exit 1
          fi
      - name: The tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::A tag $GITHUB_REF_NAME não está no main"
            exit 1
          fi
      - name: Package
        run: npm pack
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" djassi-lite-*.tgz --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
